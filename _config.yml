# Site Settings
title: "Marco Lo Faso"
description: "Marco Lo Faso - PhD Candidate in Economics at the University of Southern California (USC), visiting Harvard University. Research in spatial economics, political economy, geography of protests, and the George Floyd movement."
url: "https://marcolofas.github.io"
baseurl: ""
repository: "marcolofas/marcolofas.github.io"

# Theme
minimal_mistakes_skin: "default"
remote_theme: "mmistakes/minimal-mistakes"

# Site Search
search: false

# Build Settings
markdown: kramdown
kramdown:
  input: GFM

# Outputting
permalink: /:categories/:title/
timezone: America/Los_Angeles

# Pagination
paginate: 5
paginate_path: /page:num/

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Includes
include:
  - _pages

# Author
author:
  name: " "
  avatar: "/assets/images/profile.jpg"
  location: "Los Angeles, CA"
  links:
    - label: "lofaso@usc.edu"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:lofaso@usc.edu"
    - label: "CV"
      icon: "fas fa-fw fa-file-pdf"
      url: "/assets/files/CV.pdf"

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
